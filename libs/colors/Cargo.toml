[package]
name = "category-patterns-colors"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
palette = { version = "0.7.7", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
