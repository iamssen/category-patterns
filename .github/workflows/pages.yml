name: Build and deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install project Rust toolchain
        run: |
          rustup toolchain install "$(awk -F '\"' '/^channel/ {print $2}' rust-toolchain.toml)" \
            --profile minimal --target wasm32-unknown-unknown --component rustfmt --component clippy
      - run: npm ci
      - run: cargo fmt --manifest-path libs/colors/Cargo.toml -- --check
      - run: cargo clippy --manifest-path libs/colors/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
